<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto - 로또 당첨 정보</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lotto</h1>
            <p>로또 당첨 번호 안내</p>
        </header>

        <main>
            <section class="latest-drawing card">
                <h2>최신 당첨 결과 (1125회)</h2>
                <p class="draw-date">추첨일: 2024-06-22</p>
                <div class="winning-numbers">
                    <!-- Numbers will be inserted by JS -->
                </div>
                <div class="bonus-number">
                    <!-- Bonus number will be inserted by JS -->
                </div>
            </section>

            <section class="number-generator card">
                <h2>로또 번호 생성기</h2>
                <p>행운의 번호를 생성해보세요.</p>
                <div class="generated-numbers">
                    <!-- Generated numbers will appear here -->
                </div>
                <button id="generate-btn">번호 생성하기</button>
            </section>

            <section class="past-drawings card">
                <h2>과거 당첨 번호</h2>
                <table>
                    <thead>
                        <tr>
                            <th>회차</th>
                            <th>당첨번호</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1124회</td>
                            <td>3, 8, 17, 30, 33, 34 + 28</td>
                        </tr>
                        <tr>
                            <td>1123회</td>
                            <td>1, 7, 9, 22, 26, 36 + 21</td>
                        </tr>
                        <tr>
                            <td>1122회</td>
                            <td>4, 10, 11, 12, 18, 45 + 35</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Lotto Info. All rights reserved.</p>
        </footer>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
